name: Mirror to Toptal GitLab

on: [push]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Push to Toptal GitLab
        run: |
          git remote add toptal https://${{ secrets.TOPTAL_USERNAME }}:${{ secrets.TOPTAL_PASSWORD }}@git.toptal.com/screening-ops/Don-shin.git
          git push toptal --all --force
          git push toptal --tags --force
