name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  REGION: us-central1
  REPO_NAME: toptal-artifacts

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and Push API Container
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/api:${{ github.sha }}"
          docker build -t $IMAGE_PATH ./api
          docker push $IMAGE_PATH

      - name: Build and Push Web Container
        run: |
          IMAGE_PATH="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/web:${{ github.sha }}"
          docker build -t $IMAGE_PATH ./web
          docker push $IMAGE_PATH

      - name: Deploy API Tier
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: toptal-api
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/api:${{ github.sha }}

      - name: Deploy Web Tier
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: toptal-web
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/web:${{ github.sha }}

      - name: Mirror to GitLab
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@git.toptal.com/your-username/node-3tier-app2.git
          git push gitlab main --force

          
